{% extends 'base.html' %}
{% block content %}
<h2>Excluir Tipo: {{ tipo.tipo }}</h2>
<form method="post">
  {% csrf_token %}
  <p>Tem certeza que deseja excluir este tipo? Esta ação não pode ser desfeita.</p>
  <button type="submit" class="btn btn-danger">Excluir</button>
  <a href="{% url 'home' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
