{% extends 'base.html' %}
{% block content %}
  <div class="form-card">
    <h3>Editar Artigo</h3>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Salvar</button>
      <a href="{% url 'secao_detail' artigo.secao.id %}" class="btn ghost">Cancelar</a>
    </form>
  </div>
{% endblock %}
