{% extends 'base.html' %}

{% block content %}
  <div class="card" style="max-width:560px;margin:0 auto">
    <h2>Password reset</h2>
    <p class="muted">Enter the email associated with your account to receive reset instructions.</p>
    <form method="post" class="form-grid">
      {% csrf_token %}
      {{ form.email.label_tag }}
      {{ form.email }}
      <div class="actions">
        <button class="btn" type="submit">Reset</button>
      </div>
    </form>
  </div>
{% endblock %}
